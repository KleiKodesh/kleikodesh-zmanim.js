name: collect-references
on: workflow_dispatch
permissions: { contents: write }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/verify-citations.mjs > /dev/null
      - run: node scripts/collect-references.mjs
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references
          git diff --cached --quiet || { git commit -m "references: openly licensed copies of cited sources

          User-facing: none"; git pull --rebase; git push; }
