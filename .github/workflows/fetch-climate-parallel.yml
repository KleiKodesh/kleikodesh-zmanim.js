# Same download as fetch-climate.yml, split across parallel runners so a large batch of new
# places finishes in minutes: each runner has its own IP, so Open-Meteo's per-IP limit applies
# per shard. Each shard uploads its rows; the merge job folds them into data/climate.tsv and
# commits once.  Start: gh workflow run fetch-climate-parallel.yml -f shards=12
name: fetch-climate-parallel
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to fetch for and commit to
        default: master
      shards:
        description: Number of parallel runners (max 20)
        default: '12'
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.m.outputs.list }}
    steps:
      - id: m
        run: echo "list=$(seq -s, 0 $(( ${{ inputs.shards }} - 1 )) | sed 's/^/[/;s/$/]/')" >> "$GITHUB_OUTPUT"
  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch shard ${{ matrix.shard }} of ${{ inputs.shards }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          OUT: data/climate-part.tsv
        run: |
          node scripts/fetch-climate.mjs
          echo "rows in part: $(($(grep -c . data/climate-part.tsv) - 1))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: climate-part-${{ matrix.shard }}
          path: data/climate-part.tsv
          if-no-files-found: ignore
  merge:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Merge parts into data/climate.tsv
        run: |
          # Every part also holds the rows that were already there; keep one row per id, sorted.
          { head -1 data/climate.tsv
            { tail -n +2 data/climate.tsv; for f in parts/*/climate-part.tsv; do tail -n +2 "$f"; done; } |
              awk -F'\t' '!seen[$1]++' | sort -n -k1,1; } > merged.tsv
          mv merged.tsv data/climate.tsv
          echo "rows with data: $(($(grep -c . data/climate.tsv) - 1)) of $(($(grep -c . data/places.tsv) - 1))"
          awk -F'\t' 'NR>1 { e=0; for (i=2;i<=13;i++) if ($i=="") e++; if (e) print "id " $1 ": " e " empty months" }' data/climate.tsv
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/climate.tsv
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data: climate.tsv from Open-Meteo (parallel CI fetch)" -m "User-facing: none"
          git pull --rebase -q && git push
