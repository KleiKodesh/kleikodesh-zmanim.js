# Fetches monthly mean temperatures (Open-Meteo, CC BY 4.0) into data/climate.tsv and commits it back.
# Long, rate-limited download: runs here, not on a developer PC. Resumes from the rows already in the file.
name: fetch-climate
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to fetch for and commit to
        required: true
        default: master
  push:
    branches: [refraction]
    paths: [.github/workflows/fetch-climate.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch (sequential, paced, resumable; pushes every 50 places)
        env:
          CHECKPOINT: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          node scripts/fetch-climate.mjs
      - name: Summary
        if: always()
        run: |
          echo "rows with data: $(($(grep -c . data/climate.tsv) - 1)) of $(($(grep -c . data/places.tsv) - 1))"
          awk -F'\t' 'NR>1 { e=0; for (i=2;i<=13;i++) if ($i=="") e++; if (e) print "id " $1 ": " e " empty months" }' data/climate.tsv
      - name: Commit
        if: always()
        run: |
          git add data/climate.tsv
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data: climate.tsv from Open-Meteo (CI fetch)" -m "User-facing: none"
          git push
