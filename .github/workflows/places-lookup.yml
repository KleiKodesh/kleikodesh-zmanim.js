name: places-lookup
on:
  push:
    branches: [places-lookup]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/places-lookup.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/places-lookup.tsv
          git diff --cached --quiet || git commit -m "places lookup: candidates" -m "User-facing: none"
          git push origin HEAD:${GITHUB_REF_NAME}
